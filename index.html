<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シフト希望メモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>シフト希望メモ</h1>

    <section class="card">
      <h2>対象週</h2>
      <div class="week-controls">
        <button type="button" id="thisWeek">今週</button>
        <button type="button" id="nextWeek">来週</button>
        <input type="date" id="datePicker" aria-label="日付を選んで週を指定">
      </div>
      <p class="week-label"><span id="weekStart"></span> 以降の週（日曜始まり）</p>
    </section>

    <section class="card">
      <h2>Googleカレンダー</h2>
      <div id="calendarBox">
        <iframe id="calendar" title="Googleカレンダー（対象週）"></iframe>
        <p class="note">予定が出ないときは、このブラウザで Google にログインしているか確かめてください。</p>
      </div>
      <details id="calendarSettings">
        <summary>カレンダーの設定</summary>
        <label class="field">
          カレンダーID（ふつうは自分の Gmail アドレス）
          <input type="email" id="calendarId" placeholder="例: example@gmail.com" autocomplete="email">
        </label>
      </details>
    </section>

    <section class="card">
      <h2>曜日ごとの希望</h2>
      <div id="days"></div>
    </section>

    <section class="card">
      <label class="limit">
        一週間の勤務回数の上限
        <select id="limit"></select>
        回
      </label>
    </section>

    <section class="card">
      <h2>文面（入力に合わせて自動で更新）</h2>
      <textarea id="preview" rows="12" readonly></textarea>
      <button type="button" id="send" class="primary">送信</button>
      <p id="sendStatus" class="status" role="status"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
